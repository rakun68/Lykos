[package]
name = "lykos-tui"
description = "Lykos's terminal interface."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lykos-tui"
path = "src/main.rs"

[dependencies]
lykos-term.workspace = true
lykos-client.workspace = true
crossterm.workspace = true
unicode-width.workspace = true
serde_json.workspace = true
vt100 = "0.18"

[target.'cfg(unix)'.dependencies]
# terminal.suspend raises SIGTSTP and the terminal pane opens a pty (P5 #48); crossterm already builds it.
libc = "0.2"
