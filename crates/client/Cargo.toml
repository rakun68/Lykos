[package]
name = "lykos-client"
description = "The client of Lykos's local engine server, shared by the TUI and the desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The handshake's HMAC-SHA256 and the pipe name's hash; nonces from the OS.
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
getrandom = "0.4"
