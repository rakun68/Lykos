# The Rust clients (ADR-0063): the TUI and, later, the desktop app, beside the Node package.
[workspace]
members = ["crates/term", "crates/client", "crates/tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
lykos-term = { path = "crates/term" }
lykos-client = { path = "crates/client" }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows", "bracketed-paste"] }
unicode-width = "0.2"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Rule 10: the TUI is the lightest there is. Size and speed together: fat LTO, one unit, abort on panic, stripped.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
