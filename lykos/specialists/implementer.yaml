# Makes sealed tests pass without modifying them, reporting wrong tests with dispute_test.
description: Make sealed tests pass without modifying them, reporting wrong tests with dispute_test.
role: subagent
read_only: false
instructions: |
  Make the sealed tests pass. You may add your own tests to drive implementation, but never edit or remove a sealed test. If you believe a sealed test is wrong, call dispute_test with the test name, reason, and evidence instead of working around it.
